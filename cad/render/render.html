<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Satellite1 speaker render</title>
<style>
  html, body { margin: 0; background: #f4f3f0; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
  #wrap { position: relative; }
  canvas { display: block; }
  svg#ov { position: absolute; left: 0; top: 0; pointer-events: none; }
  #panel { position: absolute; top: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 48px 44px;
           background: #ffffff; border-left: 1px solid #e3e1dc; color: #1f2226; display: none; }
  #panel h1 { font-size: 30px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.3px; }
  #panel .sub { font-size: 16px; color: #6b6f76; margin-bottom: 26px; }
  #panel h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 1.2px; color: #8a8f96; margin: 26px 0 10px; }
  #panel ol { margin: 0; padding-left: 0; list-style: none; }
  #panel li { font-size: 16px; line-height: 1.35; margin: 0 0 9px; display: flex; gap: 10px; }
  .num { flex: none; width: 24px; height: 24px; border-radius: 12px; background: #1f2226; color: #fff;
         font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .step { flex: none; width: 24px; color: #e07b39; font-weight: 700; }
  #title { position: absolute; left: 48px; top: 40px; color: #1f2226; }
  #title h1 { margin: 0; font-size: 32px; letter-spacing: -0.4px; }
  #title div { color: #6b6f76; font-size: 17px; margin-top: 4px; }
</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="wrap">
  <div id="title"></div>
  <svg id="ov"></svg>
  <div id="panel"></div>
</div>
<script type="module">
import * as THREE from "three";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";

const q = new URLSearchParams(location.search);
const view = q.get("view") || "hero";             // hero | cutaway | exploded | top
const W = +(q.get("w") || 1600), H = +(q.get("h") || 1600);
const PANEL = view === "exploded" ? 620 : 0;

const meta = await (await fetch("/scene/manifest.json")).json();
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W - PANEL, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
document.getElementById("wrap").prepend(renderer.domElement);
document.getElementById("wrap").style.width = W + "px";
document.getElementById("wrap").style.height = H + "px";

const scene = new THREE.Scene();
scene.background = new THREE.Color(view === "exploded" ? 0xf7f6f3 : 0xeceae5);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(-350, -500, 700);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
const sc = key.shadow.camera; sc.left = -450; sc.right = 450; sc.top = 450; sc.bottom = -450; sc.far = 2500;
key.shadow.bias = -0.0004; key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.6); rim.position.set(500, 600, 400); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0xbfbab0, 0.35));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.receiveShadow = true;
ground.position.z = view === "exploded" ? -45 : -3.6;
scene.add(ground);

const clip = view === "cutaway" ? [new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0)] : [];
const hideInHero = new Set(["foam", "butyl"]);
const loader = new STLLoader();
const meshes = {};
for (const p of meta.parts) {
  if (view !== "exploded" && view !== "cutaway" && hideInHero.has(p.name)) continue;
  const g0 = await new Promise((res) => loader.load("/scene/" + p.file, res));
  const g = toCreasedNormals(g0, Math.PI / 6);
  const isGlow = p.name === "diffuser";
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(p.color),
    roughness: p.name.startsWith("drv_plug") ? 0.3 : (p.name.endsWith("pcb") ? 0.45 : 0.62),
    metalness: ["drv_plug", "drv_magnet", "butyl"].includes(p.name) ? 0.7 : 0.0,
    emissive: isGlow ? new THREE.Color(0x58c8ff) : new THREE.Color(0x000000),
    emissiveIntensity: isGlow ? 1.6 : 0,
    clippingPlanes: clip,
    side: view === "cutaway" ? THREE.DoubleSide : THREE.FrontSide,
  });
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true; m.receiveShadow = true;
  if (view === "exploded") m.position.set(...p.explode);
  scene.add(m);
  meshes[p.name] = { mesh: m, meta: p };
}

// camera
const cam = new THREE.PerspectiveCamera(view === "exploded" ? 26 : 24, (W - PANEL) / H, 10, 6000);
cam.up.set(0, 0, 1);
const zt = meta.Z_TOP;
let target, pos;
if (view === "hero")      { target = new THREE.Vector3(0, 0, zt * 0.47); pos = new THREE.Vector3(-420, -760, 400); }
if (view === "cutaway")   { target = new THREE.Vector3(0, 0, zt * 0.5);  pos = new THREE.Vector3(820, -360, 330); }
if (view === "top")       { target = new THREE.Vector3(0, 0, zt - 10);   pos = new THREE.Vector3(-160, -330, zt + 420); }
if (view === "exploded")  { target = new THREE.Vector3(10, -60, 215);    pos = new THREE.Vector3(1050, -1250, 720); }
cam.position.copy(pos); cam.lookAt(target);
renderer.render(scene, cam);

// ---------------------------------------------------------------------------- overlays
const ov = document.getElementById("ov");
ov.setAttribute("width", W - PANEL); ov.setAttribute("height", H);
const svg = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); ov.appendChild(e); return e; };
const project = (v) => { const p = v.clone().project(cam); return [(p.x + 1) / 2 * (W - PANEL), (1 - p.y) / 2 * H]; };

const title = document.getElementById("title");
if (view === "hero")    title.innerHTML = "<h1>Satellite1 shelf speaker</h1><div>Dayton RS100-4 · 1.8 L sealed · 130 × 94 × 242 mm</div>";
if (view === "cutaway") title.innerHTML = "<h1>Cutaway</h1><div>Sealed driver chamber · floating mic head on TPU springs</div>";

function anchorOf(name) {
  // nearest real vertex to the bounding-box centre, so multi-piece parts point at a piece
  const m = meshes[name].mesh; const b = new THREE.Box3().setFromObject(m);
  const c = b.getCenter(new THREE.Vector3()); const pos = m.geometry.attributes.position;
  let best = null, bd = Infinity; const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i += 7) {
    v.fromBufferAttribute(pos, i).add(m.position);
    const d = v.distanceToSquared(c); if (d < bd) { bd = d; best = v.clone(); }
  }
  return best || c;
}
function callouts(list, side) {
  // list: [{n, text, anchor:Vector3}] ; distributed in a column on the given side
  const pts = list.map((c) => ({ ...c, s: project(c.anchor) })).sort((a, b) => a.s[1] - b.s[1]);
  const top = 150, bot = H - 90, step = (bot - top) / Math.max(1, pts.length - 1);
  pts.forEach((c, i) => {
    if (c.n === "") c.n = String(i + 1);
    const y = pts.length === 1 ? c.s[1] : top + i * step;
    const x = side === "L" ? 80 : W - PANEL - (c.text ? 330 : 80);
    const ex = side === "L" ? x + 18 : x - 18;
    svg("polyline", { points: `${ex},${y} ${(ex + c.s[0]) / 2},${y} ${c.s[0]},${c.s[1]}`, fill: "none",
                      stroke: "#1f2226", "stroke-width": 1.4 });
    svg("circle", { cx: c.s[0], cy: c.s[1], r: 4, fill: "#e07b39", stroke: "#fff", "stroke-width": 1.5 });
    svg("circle", { cx: x, cy: y, r: 17, fill: "#1f2226" });
    const t = svg("text", { x, y: y + 5.5, "text-anchor": "middle", "font-size": 16, "font-weight": 700, fill: "#fff" });
    t.textContent = c.n;
    if (c.text) {
      const l = svg("text", { x: side === "L" ? x - 24 : x + 24, y: y + 5, "text-anchor": side === "L" ? "end" : "start",
                              "font-size": 15, fill: "#1f2226" });
      l.textContent = c.text;
    }
  });
}

if (view === "cutaway") {
  const L = [
    { n: "", text: "Mic port + gasket", anchor: new THREE.Vector3(0, meta.HAT_Y - 35.5, zt - 4) },
    { n: "", text: "HAT on head bosses", anchor: new THREE.Vector3(-10, meta.HAT_Y - 10, meta.ZC + 15) },
    { n: "", text: "TPU spring isolator", anchor: new THREE.Vector3(-meta.W / 2 + 14, -meta.D / 2 + 14, meta.ZC) },
    { n: "", text: "10 mm roof, sealed", anchor: new THREE.Vector3(-20, 0, meta.ZC - 5) },
    { n: "", text: "Butyl on side wall", anchor: new THREE.Vector3(-meta.W / 2 + 5, 5, 110) },
    { n: "", text: "Foam on back wall", anchor: new THREE.Vector3(-30, meta.D / 2 - 10, 150) },
    { n: "", text: "RS100-4 (1.8 L sealed)", anchor: new THREE.Vector3(-5, -meta.D / 2 + 20, meta.Z_DRV) },
  ];
  callouts(L, "R");
}

if (view === "exploded") {
  const items = [];
  const seen = new Set();
  for (const k in meshes) {
    const p = meshes[k].meta;
    if (!p.callout || seen.has(p.callout)) continue;
    seen.add(p.callout);
    const an = anchorOf(k);
    items.push({ n: String(p.callout), text: "", anchor: an, side: project(an)[0] < (W - PANEL) * 0.45 ? "L" : "R" });
  }
  items.sort((a, b) => +a.n - +b.n);
  callouts(items.filter((i) => i.side === "L"), "L");
  callouts(items.filter((i) => i.side === "R"), "R");

  const parts = meta.parts.filter((p) => p.callout).sort((a, b) => a.callout - b.callout)
    .filter((p, i, a) => i === 0 || p.callout !== a[i - 1].callout);
  const panel = document.getElementById("panel");
  panel.style.display = "block"; panel.style.width = PANEL + "px";
  panel.innerHTML = `<h1>Assembly</h1><div class="sub">Satellite1 shelf speaker · per unit</div>
    <h2>Parts</h2><ol>${parts.map((p) => `<li><span class="num">${p.callout}</span>${p.label}</li>`).join("")}</ol>
    <h2>Steps</h2><ol>
      <li><span class="step">A</span>Stick foam (2) on the back wall and butyl (3) on both side walls of the chamber (1).</li>
      <li><span class="step">B</span>Epoxy the baffle (4) into the chamber rebate. Clamp face-down; let it cure.</li>
      <li><span class="step">C</span>Wire up through the roof gland, seal with silicone. Solder to driver, add 10–15 g polyfill.</li>
      <li><span class="step">D</span>Gasket (5) + RS100-4 (8), 6 × M3 screws in a star pattern. Press the cone: it should return slowly.</li>
      <li><span class="step">E</span>Feet (6) into the base recesses; isolators (7) into the roof sockets, spokes down.</li>
      <li><span class="step">F</span>Head (12) upside down: diffuser (13), button caps (14), mic gaskets (11).</li>
      <li><span class="step">G</span>Core (9) onto HAT (10); screw HAT to head bosses, 4 × M3 × 8, I/O to the rear.</li>
      <li><span class="step">H</span>Plug speaker wire into J4, lower head onto isolators. Power via CORE/ESP USB-C, 30 W PD.</li>
    </ol>`;
}
window.__done = true;
</script>
</body>
</html>
